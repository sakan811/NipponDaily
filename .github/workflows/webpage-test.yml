name: Web App Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Install the browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Build and run the browser tests
        run: pnpm test:e2e

      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # `nuxt dev` reports what a production build keeps quiet: a Vue warning, a
  # hydration mismatch. Chromium only; the page compiles on first visit.
  e2e-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm, Node.js and the dependencies
        uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the app in dev mode and fail on a Vue warning
        run: pnpm test:e2e:dev

      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-dev
          path: playwright-report/
          retention-days: 7
